; Ladybug retro-dev web app — process supervision.
;
; Brings up the headless X stack (Xvfb -> fluxbox -> x11vnc -> noVNC) and the
; FastAPI backend. Per-instance XRoar processes are NOT supervised here: the
; backend spawns them itself as children, inheriting DISPLAY=:99.
;
; Priorities order startup: the X display must exist before anything that
; draws to it.

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

; --- virtual X display -----------------------------------------------------
[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1024x768x24 -nolisten tcp
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --- window manager (so the XRoar window has a frame / can be addressed) ---
[program:fluxbox]
command=/usr/bin/fluxbox
environment=DISPLAY=":99"
priority=20
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --- VNC server exporting the Xvfb display ---------------------------------
[program:x11vnc]
command=/usr/bin/x11vnc -display :99 -forever -shared -nopw -rfbport 5900 -noxdamage -quiet
priority=30
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --- noVNC: serves the VNC stream to the browser at :6080/vnc.html ---------
[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc 6080 localhost:5900
priority=40
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --- FastAPI backend (the web app proper) ----------------------------------
[program:webapp]
command=/usr/bin/python3 -m uvicorn backend.main:app --host 0.0.0.0 --port 8765 --loop asyncio
directory=/app/web
environment=DISPLAY=":99",XROAR_BIN="/usr/local/bin/xroar-monitor",HOME="/root",SDL_AUDIODRIVER="dummy"
priority=50
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
